[package]
name = "gjallarhorn"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only web dashboard over the reports the Trivy Operator writes to a Kubernetes cluster"
repository = "https://github.com/DiverOfDark/gjallarhorn"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.1.0", features = ["gzip"] }
mime_guess = "2.0.5"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
