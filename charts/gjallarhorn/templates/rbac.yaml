apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gjallarhorn.fullname" . }}
  labels: {{- include "gjallarhorn.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.rbac.create }}
---
# Read-only. Exposed-secret reports are read, but the dashboard never parses
# or serves the matched text.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gjallarhorn.fullname" . }}
  labels: {{- include "gjallarhorn.labels" . | nindent 4 }}
rules:
  - apiGroups: [aquasecurity.github.io]
    resources:
      - vulnerabilityreports
      - configauditreports
      - clusterconfigauditreports
      - rbacassessmentreports
      - clusterrbacassessmentreports
      - exposedsecretreports
      - clustercompliancereports
    verbs: [get, list]
  # Shows reports on ReplicaSets under the Deployment that owns them.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gjallarhorn.fullname" . }}
  labels: {{- include "gjallarhorn.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "gjallarhorn.fullname" . }} }
subjects:
  - { kind: ServiceAccount, name: {{ include "gjallarhorn.fullname" . }}, namespace: {{ .Release.Namespace }} }
{{- end }}
